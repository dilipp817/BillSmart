# ================================================================
# Render.com — DEV Web Service
# Database: Neon.tech (free, never expires)
# To deploy: New → Web Service → connect GitHub repo → branch: develop
# After deploy: set SPRING_DATASOURCE_URL / USERNAME / PASSWORD /
#               APP_JWT_SECRET manually in Render Dashboard → Environment
# ================================================================

services:
  - type: web
    name: billsmart-api-dev
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev

      # --- Neon.tech DB credentials (set manually in Render Dashboard) ---
      # Get these from: Neon Dashboard → dev branch → Connection Details → Java(JDBC)
      - key: SPRING_DATASOURCE_URL
        sync: false   # e.g. jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/neondb
      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # e.g. neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # from Neon connection details

      # --- JWT Secret (set manually in Render Dashboard — never auto-generate) ---
      - key: APP_JWT_SECRET
        sync: false   # run: openssl rand -base64 64

      # --- Render edge handles HTTPS — disable Spring's internal SSL ---
      - key: SERVER_SSL_ENABLED
        value: "false"
      - key: SERVER_PORT
        value: "10000"

