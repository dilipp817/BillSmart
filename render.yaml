projects:
  - name: billsmart
    environments:

      # ── PRODUCTION environment ─────────────────────────────────────
      - name: production
        services:
          - type: web
            name: billsmart-api
            runtime: docker
            plan: free
            dockerfilePath: ./Dockerfile
            healthCheckPath: /actuator/health
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: prod
              - key: SPRING_DATASOURCE_URL
                fromDatabase:
                  name: BillSmart
                  property: connectionString
              - key: SPRING_DATASOURCE_USERNAME
                fromDatabase:
                  name: BillSmart
                  property: user
              - key: SPRING_DATASOURCE_PASSWORD
                fromDatabase:
                  name: BillSmart
                  property: password
              - key: APP_JWT_SECRET
                generateValue: true
              - key: SERVER_SSL_ENABLED
                value: "false"
              - key: SERVER_PORT
                value: "10000"
        databases:
          # Keep Render-generated values for the existing production DB
          - name: BillSmart
            databaseName: smart_pos_9obz
            user: smart_pos_9obz_user
            plan: free
            region: singapore

      # ── UAT environment (User Acceptance Testing) ─────────────────
      # Runs the "uat" Spring profile: INFO logging, seed data via Flyway,
      # ddl-auto=validate. SSL disabled — Render's edge handles HTTPS.
      - name: uat
        services:
          - type: web
            name: billsmart-api-uat
            runtime: docker
            plan: free
            dockerfilePath: ./Dockerfile
            healthCheckPath: /actuator/health
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: uat
              - key: SPRING_DATASOURCE_URL
                fromDatabase:
                  name: billsmart-uat-db
                  property: connectionString
              - key: SPRING_DATASOURCE_USERNAME
                fromDatabase:
                  name: billsmart-uat-db
                  property: user
              - key: SPRING_DATASOURCE_PASSWORD
                fromDatabase:
                  name: billsmart-uat-db
                  property: password
              - key: APP_JWT_SECRET
                generateValue: true
              - key: SERVER_SSL_ENABLED
                value: "false"
              - key: SERVER_PORT
                value: "10000"
        databases:
          # databaseName and user are auto-generated by Render for new databases
          - name: billsmart-uat-db
            plan: free
            region: singapore

      # ── DEV environment (mobile team sandbox) ─────────────────────
      # Runs the "dev" Spring profile: verbose SQL + DEBUG logging.
      # SSL is disabled — Render's edge proxy provides HTTPS automatically.
      - name: dev
        services:
          - type: web
            name: billsmart-api-dev
            runtime: docker
            plan: free
            dockerfilePath: ./Dockerfile
            healthCheckPath: /actuator/health
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: dev
              - key: SPRING_DATASOURCE_URL
                fromDatabase:
                  name: billsmart-dev-db
                  property: connectionString
              - key: SPRING_DATASOURCE_USERNAME
                fromDatabase:
                  name: billsmart-dev-db
                  property: user
              - key: SPRING_DATASOURCE_PASSWORD
                fromDatabase:
                  name: billsmart-dev-db
                  property: password
              - key: APP_JWT_SECRET
                generateValue: true
              - key: SERVER_SSL_ENABLED
                value: "false"
              - key: SERVER_PORT
                value: "10000"
        databases:
          # databaseName and user are auto-generated by Render for new databases
          - name: billsmart-dev-db
            plan: free
            region: singapore
