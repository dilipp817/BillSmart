# ================================================================
# Render.com — Web Services (DEV + UAT + PRODUCTION)
# Database: Neon.tech (3 branches — free, never expires)
#
# After first deploy, set these env vars manually in Render Dashboard
# for EACH of the 3 services:
#   SPRING_DATASOURCE_URL      → Neon JDBC URL for that branch
#   SPRING_DATASOURCE_USERNAME → neondb_owner
#   SPRING_DATASOURCE_PASSWORD → from Neon Dashboard
#   APP_JWT_SECRET             → openssl rand -base64 64  (different per service)
# ================================================================

services:

  # ── DEV service (mobile team sandbox) ─────────────────────────────
  # Neon branch: dev
  # URL: jdbc:postgresql://ep-shy-unit-a1l91aoe-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
  - type: web
    name: billsmart-api-dev
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: SERVER_SSL_ENABLED
        value: "false"
      - key: SERVER_PORT
        value: "10000"

  # ── UAT service (User Acceptance Testing) ─────────────────────────
  # Neon branch: uat
  # URL: jdbc:postgresql://ep-misty-shape-a1f0uvz3-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
  - type: web
    name: billsmart-api-uat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: uat
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: SERVER_SSL_ENABLED
        value: "false"
      - key: SERVER_PORT
        value: "10000"

  # ── PRODUCTION service ─────────────────────────────────────────────
  # Neon branch: production
  # URL: jdbc:postgresql://ep-shiny-star-a1buza1q.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
  - type: web
    name: billsmart-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: SERVER_SSL_ENABLED
        value: "false"
      - key: SERVER_PORT
        value: "10000"
