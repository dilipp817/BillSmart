# Test profile - PostgreSQL (same engine as dev/uat/prod)
spring.profiles.active=test
server.ssl.enabled=false
server.port=0
# PostgreSQL Test Database
spring.datasource.url=jdbc:postgresql://localhost:5432/billsmart_test
spring.datasource.username=postgres
spring.datasource.password=Abc123@def
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Flyway - run full migrations on test DB (clean first to get a fresh state)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
# Logging
logging.level.org.flywaydb=INFO
