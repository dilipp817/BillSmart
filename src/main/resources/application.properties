spring.application.name=smartpos

# SSL / HTTPS settings (dev - self-signed keystore)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# Allow connections from all network interfaces
server.address=0.0.0.0

# NOTE: Development and test datasource configs were moved to profile-specific files:
# - src/main/resources/application-dev.properties (for local development)
# - src/test/resources/application-test.properties (for tests)
