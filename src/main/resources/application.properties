spring.application.name=smartpos
# -----------------------------------------------
# Active Profile  (override via -Dspring.profiles.active=uat|prod)
# -----------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# -----------------------------------------------
# Application Metadata (shared across all profiles)
# -----------------------------------------------
app.name=BillSmart
app.version=1.0.0
app.description=Restaurant & Billing Management System
# -----------------------------------------------
# JWT Configuration (override secret via env var in UAT / Prod)
# -----------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:oz28K9VFHSbWuBcypPJRmn3al/OIApDZpYHLJ08HgCJoyp5UcFDvtuFGjHA+K3C/F7sKO7qxDSwRLf3Y3soRZw==}
app.jwt.expiration=86400000
# -----------------------------------------------
# Actuator / Health Check (shared)
# -----------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
