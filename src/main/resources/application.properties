spring.application.name=smartpos

# Global SSL Settings (enabled by default for local dev; overridden in prod profile)
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:your-secret-key-change-this-in-production-with-a-strong-random-string-of-at-least-32-characters}
app.jwt.expiration=86400000

# Application Settings
app.name=BillSmart
app.version=1.0.0
app.description=Restaurant & Billing Management System
