--- Database Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Abc123@def
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Setup ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Fix for PostgreSQL 18 ---
# Disabling Flyway locally is the fastest way to bypass the "Unsupported Database" error.
spring.flyway.enabled=false

# --- Server Settings ---
# Note: Ensure keystore.p12 exists in resources if keeping SSL enabled
server.port=8443