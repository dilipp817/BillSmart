# ================================================================
# DEVELOPMENT Profile  (spring.profiles.active=dev)
# ================================================================

# --- Server Settings ---
# When running locally: port 8443, SSL enabled.
# When deployed to Render (or any cloud): override via env vars:
#   SERVER_PORT=10000  SERVER_SSL_ENABLED=false
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# --- Database Connection ---
# Local: uses localhost PostgreSQL
# On Render: SPRING_DATASOURCE_URL/USERNAME/PASSWORD are injected via env vars (Neon.tech)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billsmart_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeit}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (Hikari) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# Required for Neon.tech — enforces SSL on the JDBC connection
spring.datasource.hikari.data-source-properties.sslmode=require

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# --- Actuator (full detail in dev for easy debugging) ---
management.endpoint.health.show-details=always

# --- Logging (verbose for development) ---
logging.level.root=INFO
logging.level.com.autobill=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
