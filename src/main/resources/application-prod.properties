# ================================================================
# PRODUCTION Profile  (spring.profiles.active=prod)
# ALL sensitive values MUST be supplied via environment variables.
# Never hard-code credentials here.
# ================================================================

# --- Server Port (Render / cloud platform injects PORT) ---
server.port=${PORT:10000}

# --- SSL: Disabled ? SSL is terminated at the edge (Render / load-balancer) ---
server.ssl.enabled=false

# --- Database Connection (REQUIRED environment variables) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (Hikari) ? tuned for cloud free tier ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate (Production Safety) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'none' ? Hibernate must NEVER modify the production schema; use Flyway only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# --- JWT (REQUIRED environment variable) ---
app.jwt.secret=${APP_JWT_SECRET}

# --- Logging (minimal ? errors + warnings only) ---
logging.level.root=WARN
logging.level.com.autobill=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
