# Production profile - PostgreSQL example

# Recommended: configure these via environment variables in production instead of committing secrets
# Prefer SPRING_DATASOURCE_* env vars set by docker-compose, then DATABASE_* as fallback, then hardcoded defaults
# TODO: database url username password should not be kept here for security reasons. Keep placeholder & change it when it requires
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://db:5432/mydb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:myuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:mypassword}}

# Use a production-ready hibernate ddl strategy (none/update/create can be dangerous)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.initialization-mode=never

# Connection pool (Hikari) tuning (tweak as needed)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Disable H2 console in prod
spring.h2.console.enabled=false

# Logging
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# Management / Actuator settings for production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.server.port=8081
