# --- Database Connection (via Environment Variables) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (Production Safety) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'none' ensures Hibernate never accidentally deletes production data
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Connection Pool (Hikari) ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# --- Flyway for Production ---
# In prod, we usually want Flyway enabled for controlled migrations
spring.flyway.enabled=true
# Since PG 18 is new, we add this to prevent version-check crashes
spring.flyway.baseline-on-migrate=true

# --- Management / Health Checks ---
management.endpoints.web.exposure.include=health,info