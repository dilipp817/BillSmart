# --- Server Port (Render injects PORT env var) ---
server.port=${PORT:8080}

# --- SSL: Disabled in production (Render terminates SSL at the edge) ---
server.ssl.enabled=${SERVER_SSL_ENABLED:false}

# --- Database Connection (via Environment Variables) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (Production Safety) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'none' ensures Hibernate never accidentally deletes production data
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Connection Pool (Hikari) - tuned for Render free tier ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- Flyway for Production ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- JWT (override via env var APP_JWT_SECRET) ---
app.jwt.secret=${APP_JWT_SECRET:change-this-secret-in-production}

# --- Management / Health Checks ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
