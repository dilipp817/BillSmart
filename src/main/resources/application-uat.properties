# ================================================================
# UAT (User Acceptance Testing) Profile  (spring.profiles.active=uat)
# Set environment variables on the UAT server / pipeline for
# credentials ? do NOT hard-code secrets here.
# ================================================================

# --- Server Settings ---
server.port=${SERVER_PORT:10000}
# SSL is terminated at the edge (Render / load-balancer).
# Default is false; override SERVER_SSL_ENABLED=true only when running locally with HTTPS.
server.ssl.enabled=${SERVER_SSL_ENABLED:false}

# --- Database Connection (use environment variables on UAT server) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billsmart_uat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeit}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (Hikari) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' keeps the schema in check without auto-altering it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# --- JWT (override via env var APP_JWT_SECRET on UAT server) ---
app.jwt.secret=${APP_JWT_SECRET:uat-secret-key-replace-with-strong-random-string-min-32-chars}

# --- Logging (informational ? less noise than dev, more than prod) ---
logging.level.root=INFO
logging.level.com.autobill=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN

